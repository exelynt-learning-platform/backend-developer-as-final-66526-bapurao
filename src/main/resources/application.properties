spring.application.name=booking-system
spring.datasource.url=jdbc:postgresql://localhost:5432/booking-syatem
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.jwt.secret=${JWT_SECRET:change-this-development-secret-to-at-least-32-bytes-long}
app.jwt.expiration-ms=${JWT_EXPIRATION:3600000}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
server.error.include-message=never
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect